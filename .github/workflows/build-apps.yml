name: Build apps

# Desktop and mobile builds are produced here because they need each platform's
# own toolchain (Xcode, MSVC, GTK headers). Every job starts from the same Flutter
# source in apps/mobile and the platform folders are generated on the runner, so
# the repository stays one shared codebase with no checked-in build scaffolding.
#
# Publishing a rolling `app-latest` release means /download links never change:
# GitHub's releases/latest redirect always resolves to the newest assets.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Scaffold platform folders
        run: flutter create --org et.syncourse --project-name syncourse .
      - name: Release manifest fixes
        run: dart tool/prepare_platforms.dart
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/syncourse-release.jks"
          echo "SYNCOURSE_KEYSTORE=$RUNNER_TEMP/syncourse-release.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release
      - name: Collect and sign asset
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          BUILD_TOOLS=$(ls "$SDK/build-tools" | sort -V | tail -1)
          ZIPALIGN="$SDK/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$SDK/build-tools/$BUILD_TOOLS/apksigner"
          # Flutter signs release APKs with a debug key generated per runner, so
          # the signature changed on every build and an update could not install
          # over the previous one. Re-align and sign with the project key kept in
          # repository secrets.
          "$ZIPALIGN" -f 4 build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/syncourse-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$SYNCOURSE_KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/dist/syncourse-android.apk" \
            "$RUNNER_TEMP/syncourse-aligned.apk"
          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/dist/syncourse-android.apk" | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Scaffold platform folders
        run: flutter create --org et.syncourse --project-name syncourse .
      - name: Release manifest fixes
        run: dart tool/prepare_platforms.dart
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - run: flutter build linux --release
      - name: Collect asset
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -czf "$GITHUB_WORKSPACE/dist/syncourse-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error

  windows:
    name: Windows desktop
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Scaffold platform folders
        run: flutter create --org et.syncourse --project-name syncourse .
      - name: Release manifest fixes
        run: dart tool/prepare_platforms.dart
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - name: Collect asset
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:GITHUB_WORKSPACE/dist/syncourse-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error

  macos:
    name: macOS (Apple silicon)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Scaffold platform folders
        run: flutter create --org et.syncourse --project-name syncourse .
      - name: Release manifest fixes
        run: dart tool/prepare_platforms.dart
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - run: flutter build macos --release
      - name: Package disk image
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          hdiutil create -volname "Syncourse" \
            -srcfolder build/macos/Build/Products/Release/syncourse.app \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/dist/syncourse-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          # A tag push publishes that version; a manual run refreshes the rolling
          # `app-latest` release that every /download link points at.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'app-latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Syncourse latest builds' }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Native builds of the Syncourse app, produced from `apps/mobile`.

            | Platform | File |
            | --- | --- |
            | Android 7+ | `syncourse-android.apk` |
            | Windows 10/11 x64 | `syncourse-windows-x64.zip` |
            | Linux x64 | `syncourse-linux-x64.tar.gz` |
            | macOS 11+ (Apple silicon) | `syncourse-macos-arm64.dmg` |

            Desktop builds are unsigned: macOS asks for right-click → Open the first
            time, and Windows SmartScreen may ask once.
          files: dist/*

# Syncourse — Render Blueprint (infrastructure as code)
# Deploys the NestJS API as a free web service. Secrets are injected via
# Render's dashboard/API (marked sync: false below) — never committed.

services:
  - type: web
    name: syncourse-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w packages/design-tokens && npm run build -w packages/shared-types && npm run db:generate -w apps/api && npm run build -w apps/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TELEBIRR_ACCOUNT_NAME
        sync: false
      - key: TELEBIRR_ACCOUNT_NUMBER
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Email — Brevo. Either path works; the API prefers the REST key when both
      # are set. BREVO_API_KEY is the xkeysib-… REST key; BREVO_SMTP_KEY is the
      # xsmtpsib-… relay key, which needs BREVO_SMTP_USER (the xxxxx@smtp-brevo.com
      # relay login, NOT the account email) alongside it.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      # 2525, not 465: Render blackholes outbound SMTP on 465 (and 587), so every
      # send hung for 120s and failed with "Connection timeout" — which is why no
      # mail ever arrived from this service. Brevo listens on 2525 too, and it is
      # reachable from Render. Verified: register went from a 120s timeout to a
      # 3s success the moment the port changed. Keep this off 465.
      - key: BREVO_SMTP_PORT
        value: "2525"
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
